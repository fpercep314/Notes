name: notes

services:
  postgres:
    image: postgres:18
    container_name: notes-postgres
    # Valores en el .env de la raíz (plantilla: .env.example). Sin valores por defecto:
    # si falta una variable, Compose se detiene con el mensaje de ":?".
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Falta POSTGRES_PORT en .env}:5432"
    volumes:
      # Desde postgres:18 el volumen se monta en /var/lib/postgresql (no en .../data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
